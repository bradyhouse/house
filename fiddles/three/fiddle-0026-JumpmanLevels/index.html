<!DOCTYPE html>
<html>
<head>
    <title>fiddle-0026-JumpmanLevels</title>
    <meta charset="utf-8" />
    <meta name="description" content="fiddles/three/fiddle-0026-JumpmanLevels — a 2.5D three.js tribute to the 1983 platformer Jumpman">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="bradyhouse@gmail.com" />
    <link rel="shortcut icon" href="../../resources/images/favicon.ico" id="favicon" />
    <style>
      html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
      canvas { display: block; }
      #hud {
        position: fixed; top: 0; left: 0; right: 0; z-index: 10;
        display: flex; gap: 22px; align-items: baseline;
        padding: 10px 16px; pointer-events: none;
        font-family: "Courier New", ui-monospace, monospace;
        color: #7dffea; text-shadow: 0 0 8px rgba(125,255,234,0.55);
        letter-spacing: 0.14em; font-size: 15px; text-transform: uppercase;
      }
      #hud b { color: #fff6a8; text-shadow: 0 0 10px rgba(255,246,168,0.6); }
      #banner {
        position: fixed; inset: 0; z-index: 20; display: flex;
        flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; text-align: center; pointer-events: none;
        font-family: "Courier New", ui-monospace, monospace; color: #7dffea;
      }
      #banner .title { font-size: 46px; letter-spacing: 0.22em; color: #ff5db1;
        text-shadow: 0 0 18px rgba(255,93,177,0.7); }
      #banner .sub { font-size: 16px; letter-spacing: 0.16em; opacity: 0.9; }
      #banner .keys { font-size: 13px; letter-spacing: 0.1em; opacity: 0.7; margin-top: 10px; line-height: 1.8; }
      #banner.hide { display: none; }
      .flash { animation: fl 1.1s ease-in-out infinite; }
      @keyframes fl { 0%,100%{opacity:1} 50%{opacity:0.35} }
    </style>
</head>
<body>
    <a id="githubLink" href="https://github.com/bradyhouse/house/tree/master/fiddles/three/fiddle-0026-JumpmanLevels" target="_blank"><img style="z-index: 1000; position: absolute; top: 0; right: 0; border: 0;" src="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27149%27%20height%3D%27149%27%3E%3Cg%20transform%3D%27translate%2840%2C-40%29%20rotate%2845%29%27%3E%3Crect%20x%3D%270%27%20y%3D%270%27%20width%3D%27200%27%20height%3D%2726%27%20fill%3D%27%23ff7600%27/%3E%3Cline%20x1%3D%270%27%20y1%3D%274%27%20x2%3D%27200%27%20y2%3D%274%27%20stroke%3D%27%23fff%27%20stroke-width%3D%271%27%20stroke-dasharray%3D%273%202%27%20opacity%3D%270.85%27/%3E%3Cline%20x1%3D%270%27%20y1%3D%2722%27%20x2%3D%27200%27%20y2%3D%2722%27%20stroke%3D%27%23fff%27%20stroke-width%3D%271%27%20stroke-dasharray%3D%273%202%27%20opacity%3D%270.85%27/%3E%3Ctext%20x%3D%27100%27%20y%3D%2717%27%20font-family%3D%27Helvetica%2CArial%2Csans-serif%27%20font-size%3D%2711%27%20font-weight%3D%27700%27%20fill%3D%27%23fff%27%20text-anchor%3D%27middle%27%20letter-spacing%3D%270.4%27%3EFork%20me%20on%20GitHub%3C/text%3E%3C/g%3E%3C/svg%3E" alt="Fork me on GitHub"></a>

    <div id="hud">
      <span>Bombs <b id="bombs">0/0</b></span>
      <span>Score <b id="score">0</b></span>
      <span>Bonus <b id="bonus">0</b></span>
      <span>Lives <b id="lives">7</b></span>
      <span id="level">1. Dunno</span>
    </div>

    <div id="banner">
      <div class="title">JUMPMAN</div>
      <div class="sub" id="bannerSub">5 real boards</div>
      <div class="keys">
        ← → run &nbsp;·&nbsp; ↑ ↓ climb a rope or ladder &nbsp;·&nbsp; SPACE jump<br />
        collect every bomb to clear the board &nbsp;·&nbsp; mind the drop
      </div>
      <div class="sub flash" id="bannerGo" style="margin-top:16px">press SPACE to start</div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.164.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
